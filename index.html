<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domande esami Unitelma</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #191919; color: #E3E3E3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .sidebar-item.active { background-color: #2A2A2A; color: #FFF; font-weight: 500; }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">

    <!-- Overlay scuro per lo sfondo -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar a scomparsa -->
    <aside id="sidebar" class="fixed top-0 left-0 z-50 h-full w-64 bg-[#202020] border-r border-[#2A2A2A] flex flex-col justify-between p-4 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div>
            <!-- Header sidebar con pulsante chiusura -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-2 px-2 py-1.5 hover:bg-[#2A2A2A] rounded cursor-pointer text-sm font-semibold">
                    <span class="bg-[#3F3F3F] text-xs px-1.5 py-0.5 rounded">C</span> Domande esami Unitelma
                </div>
                <button id="close-sidebar-btn" class="text-gray-400 hover:text-white p-1 rounded hover:bg-[#2A2A2A]" aria-label="Chiudi menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider px-2 mb-2">Pagine</div>
            <nav id="sidebar-menu" class="space-y-1 text-sm text-gray-400"></nav>
        </div>
        
        <div class="text-xs text-gray-600 text-center">Powered by GitHub</div>
    </aside>

    <!-- Contenuto principale -->
   <main class="flex-1 p-8 overflow-y-auto w-full">
    <div class="max-w-5xl mx-auto">
        
        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <button id="open-sidebar-btn" class="p-2 bg-[#202020] hover:bg-[#2A2A2A] border border-[#2A2A2A] text-gray-300 hover:text-white rounded-lg transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 id="page-title" class="text-3xl font-bold flex items-center gap-2">Caricamento...</h1>
        </div>

        <!-- CONTENITORE VISTA HOME (Inizialmente nascosto) -->
        <div id="home-view" class="hidden"></div>

        <!-- CONTENITORE VISTA MATERIA (Filtri + Tabella) -->
        <div id="materia-view">
            <!-- Filtri -->
            <div class="flex flex-wrap gap-4 mb-6 bg-[#202020] p-4 rounded-lg border border-[#2A2A2A]">
                <!-- i tuoi filtri... -->
            </div>

            <!-- Tabella -->
            <div class="overflow-x-auto border border-[#2A2A2A] rounded-lg">
                <table class="w-full text-left border-collapse">
                    <!-- la tua tabella... -->
                </table>
            </div>
        </div>

    </div>
</main>
            
            <!-- Bottone per Aprire la Sidebar -->
            <div class="flex items-center gap-3 mb-6">
                <button id="open-sidebar-btn" class="p-2 bg-[#202020] hover:bg-[#2A2A2A] border border-[#2A2A2A] text-gray-300 hover:text-white rounded-lg transition-colors flex items-center justify-center" aria-label="Apri menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <h1 id="page-title" class="text-3xl font-bold flex items-center gap-2">Caricamento...</h1>
            </div>

            <!-- Filtri -->
            <div class="flex flex-wrap gap-4 mb-6 bg-[#202020] p-4 rounded-lg border border-[#2A2A2A]">
                <div>
                    <label for="filter-prof" class="block text-xs text-gray-400 mb-1 font-medium">Professore</label>
                    <select id="filter-prof" class="bg-[#2F2F2F] text-sm text-white rounded px-3 py-1.5 outline-none border border-[#3F3F3F] cursor-pointer">
                        <option value="all">Tutti</option>
                    </select>
                </div>

                <div>
                    <label for="filter-corso" class="block text-xs text-gray-400 mb-1 font-medium">Corso di studi</label>
                    <select id="filter-corso" class="bg-[#2F2F2F] text-sm text-white rounded px-3 py-1.5 outline-none border border-[#3F3F3F] cursor-pointer">
                        <option value="all">Tutti</option>
                    </select>
                </div>

                <div id="box-filtro-parte" class="hidden">
                    <label for="filter-parte" class="block text-xs text-gray-400 mb-1 font-medium">Parte d'esame</label>
                    <select id="filter-parte" class="bg-[#2F2F2F] text-sm text-white rounded px-3 py-1.5 outline-none border border-[#3F3F3F] cursor-pointer">
                        <option value="all">Tutti</option>
                        <option value="Prima parte">Prima parte</option>
                        <option value="Seconda parte">Seconda parte</option>
                        <option value="Intero">Intero</option>
                    </select>
                </div>
            </div>

            <!-- Tabella -->
            <div class="overflow-x-auto border border-[#2A2A2A] rounded-lg">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-[#2A2A2A] text-gray-400 text-sm bg-[#1F1F1F]">
                            <th class="p-3 font-medium w-2/5">Domanda</th>
                            <th class="p-3 font-medium">Prof</th>
                            <th class="p-3 font-medium">Corso di studi</th>
                            <th class="p-3 font-medium">Parte</th>
                            <th class="p-3 font-medium">Data</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm divide-y divide-[#2A2A2A]"></tbody>
                </table>
            </div>
        </div>
    </main>


    <!-- Script per la gestione della Sidebar -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const openBtn = document.getElementById('open-sidebar-btn');
        const closeBtn = document.getElementById('close-sidebar-btn');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.add('translate-x-0');
            overlay.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.remove('translate-x-0');
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }

        openBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);
    </script>

    <script src="script.js"></script>
</body>
</html>
